status-website:
  cname: status.fintalo.ai
  name: Fintalo Status
  introTitle: "Fintalo Status"
  introMessage: "Real-time status and uptime for Fintalo services."
  navbar:
    - title: Status
      href: /
    - title: Website
      href: https://fintalo.ai
    - title: GitHub
      href: https://github.com/Fintalo/fintalo-status
  customHeadHTML: |
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --ifm-color-primary: #142B52;
        --ifm-color-primary-dark: #0F2042;
        --ifm-color-primary-darker: #0C1B38;
        --ifm-color-primary-darkest: #08132A;
        --ifm-color-primary-light: #1B3A6E;
        --ifm-color-primary-lighter: #234589;
        --ifm-color-primary-lightest: #4A90B9;
        --ifm-font-family-base: 'Nunito Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --ifm-heading-font-weight: 700;
        --ifm-color-success: #16A34A;
        --ifm-color-danger: #DC2626;
        --ifm-color-warning: #E8A23B;
      }

      html, body {
        font-family: var(--ifm-font-family-base);
        background-color: #F8FAFC;
        color: #0A1628;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* ── Animations ───────────────────────────── */
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.35; }
      }
      @keyframes glowPulse {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50%      { transform: scale(1.15); opacity: 0.8; }
      }

      /* ── Top navbar ──────────────────────────── */
      .navbar,
      header.navbar,
      nav.navbar {
        background-color: #142B52 !important;
        box-shadow: 0 4px 24px rgba(20, 43, 82, 0.12) !important;
        position: relative;
        overflow: hidden;
      }
      .navbar::before {
        content: '';
        position: absolute;
        top: -40px; right: -20px;
        width: 180px; height: 180px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(74, 144, 185, 0.25), transparent 70%);
        pointer-events: none;
        z-index: 0;
      }
      .navbar > * { position: relative; z-index: 1; }
      .navbar a,
      .navbar__title,
      .navbar__link,
      .navbar__brand,
      .navbar__item {
        color: #FFFFFF !important;
        font-weight: 600;
        letter-spacing: -0.01em;
        transition: color 0.2s ease;
      }
      .navbar a:hover,
      .navbar__link:hover {
        color: #E8A23B !important;
      }
      .navbar__link--active,
      .navbar__link[aria-current="page"] {
        color: #E8A23B !important;
        border-bottom-color: #E8A23B !important;
      }

      /* ── Headings ────────────────────────────── */
      h1 {
        color: #0A1628;
        font-weight: 800;
        letter-spacing: -0.03em;
        font-size: 2.25rem;
      }
      h2 {
        color: #0A1628;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      h3, h4 {
        color: #0A1628;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      /* ── Section cards / monitors ───────────── */
      article,
      .card,
      [class*="card"] {
        border: 1px solid rgba(20, 43, 82, 0.08) !important;
        border-radius: 14px !important;
        background: #FFFFFF !important;
        box-shadow: 0 1px 3px rgba(10, 22, 40, 0.04) !important;
        transition: all 0.3s ease !important;
        animation: fadeInUp 0.5s ease backwards;
      }
      article:nth-child(1) { animation-delay: 0.05s; }
      article:nth-child(2) { animation-delay: 0.12s; }
      article:nth-child(3) { animation-delay: 0.19s; }
      article:nth-child(4) { animation-delay: 0.26s; }
      article:nth-child(5) { animation-delay: 0.33s; }
      article:nth-child(6) { animation-delay: 0.40s; }

      article:hover,
      .card:hover {
        border-color: rgba(74, 144, 185, 0.3) !important;
        box-shadow: 0 8px 24px rgba(20, 43, 82, 0.08) !important;
        transform: translateY(-2px);
      }

      /* ── Status badges & "is down" / incidents ─ */
      strong:has(+ :is(span, em):contains("down")),
      [class*="down"]:not([class*="download"]) {
        color: #DC2626;
        font-weight: 700;
      }

      /* Pulsing live status indicator next to "is up/down" */
      article h3::before,
      article h2::before {
        content: '';
        display: inline-block;
        width: 8px; height: 8px;
        border-radius: 50%;
        background: #16A34A;
        margin-right: 10px;
        vertical-align: middle;
        animation: blink 2.5s ease-in-out infinite;
        box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.15);
      }

      /* ── Links ───────────────────────────────── */
      a {
        color: #4A90B9;
        text-decoration: none;
        transition: color 0.2s ease;
      }
      a:hover {
        color: #142B52;
        text-decoration: underline;
      }

      /* ── Time-range pills (24h / 7d / 30d / 1y / all) ── */
      [class*="duration"],
      [class*="time-range"],
      .duration {
        color: #5A6B85;
        font-weight: 600;
        font-size: 0.875rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 4px 10px;
        border-radius: 6px;
        transition: all 0.2s ease;
      }
      [class*="duration"]:hover,
      [class*="time-range"]:hover {
        background: rgba(20, 43, 82, 0.04);
        color: #142B52;
      }
      [class*="duration"][class*="active"],
      [class*="time-range"][class*="active"],
      strong[class*="duration"] {
        color: #FFFFFF !important;
        background: #142B52 !important;
        font-weight: 700 !important;
      }

      /* ── Hero / intro section ────────────────── */
      .hero,
      header[class*="hero"] {
        background: linear-gradient(135deg, #142B52 0%, #1B3A6E 50%, #4A90B9 100%);
        color: #FFFFFF;
        padding: 4rem 2rem;
        position: relative;
        overflow: hidden;
      }
      .hero::before {
        content: '';
        position: absolute;
        top: -100px; right: -80px;
        width: 400px; height: 400px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(74, 144, 185, 0.4), transparent 70%);
        animation: glowPulse 4s ease-in-out infinite;
        pointer-events: none;
      }
      .hero::after {
        content: '';
        position: absolute;
        bottom: -60px; left: -40px;
        width: 200px; height: 200px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(232, 162, 59, 0.15), transparent 70%);
        pointer-events: none;
      }
      .hero > * {
        position: relative;
        z-index: 1;
      }
      .hero h1, .hero__title {
        color: #FFFFFF !important;
        font-weight: 800;
        letter-spacing: -0.03em;
        animation: fadeInUp 0.6s ease;
      }
      .hero p, .hero__subtitle {
        color: rgba(255, 255, 255, 0.85) !important;
        font-weight: 500;
        animation: fadeInUp 0.7s ease 0.1s backwards;
      }

      /* ── Footer ──────────────────────────────── */
      footer {
        background-color: #FFFFFF !important;
        border-top: 1px solid rgba(20, 43, 82, 0.08);
        color: #5A6B85;
      }
      footer a {
        color: #4A90B9;
      }

      /* ── Muted/secondary text ────────────────── */
      .secondary,
      [class*="secondary"],
      small {
        color: #5A6B85;
        font-weight: 500;
      }

      /* ── Buttons ─────────────────────────────── */
      button,
      .button,
      .button--primary {
        font-family: var(--ifm-font-family-base) !important;
        font-weight: 700 !important;
        letter-spacing: -0.01em;
        transition: all 0.2s ease !important;
      }
      .button--primary {
        background-color: #142B52 !important;
        border-color: #142B52 !important;
        border-radius: 8px !important;
      }
      .button--primary:hover {
        background-color: #1B3A6E !important;
        border-color: #1B3A6E !important;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(20, 43, 82, 0.15);
      }

      /* ── Container width / spacing ───────────── */
      main, .main-wrapper, [class*="container"] {
        animation: fadeInUp 0.5s ease;
      }
    </style>

