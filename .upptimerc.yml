status-website:
  cname: status.fintalo.ai
  name: Fintalo Status
  introTitle: "Fintalo Status"
  introMessage: "Real-time status and uptime for Fintalo services."
  navbar:
    - title: Status
      href: /
    - title: Website
      href: https://fintalo.ai
    - title: GitHub
      href: https://github.com/Fintalo/fintalo-status
  customHeadHTML: |
    <style>
      :root {
        --ifm-color-primary: #142B52;
        --ifm-color-primary-dark: #0F2042;
        --ifm-color-primary-darker: #0C1B38;
        --ifm-color-primary-darkest: #08132A;
        --ifm-color-primary-light: #1B3A6E;
        --ifm-color-primary-lighter: #234589;
        --ifm-color-primary-lightest: #4A90B9;
        --ifm-font-family-base: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --ifm-heading-font-weight: 600;
        --ifm-color-success: #16A34A;
        --ifm-color-danger: #DC2626;
        --ifm-color-warning: #E8A23B;
      }

      body {
        font-family: var(--ifm-font-family-base);
        background-color: #FFFFFF;
        color: #0A1628;
      }

      /* Top navbar */
      .navbar,
      header.navbar,
      nav.navbar {
        background-color: #142B52 !important;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05) !important;
      }
      .navbar a,
      .navbar__title,
      .navbar__link,
      .navbar__brand,
      .navbar__item {
        color: #FFFFFF !important;
        font-weight: 500;
      }
      .navbar a:hover,
      .navbar__link:hover {
        color: #E8A23B !important;
      }
      .navbar__link--active,
      .navbar__link[aria-current="page"] {
        color: #E8A23B !important;
        border-bottom-color: #E8A23B !important;
      }

      /* Page heading */
      h1 {
        color: #0A1628;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      h2 {
        color: #0A1628;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      /* Section cards */
      article,
      .card,
      [class*="card"] {
        border: 1px solid #E5EAF1 !important;
        border-radius: 0.5rem !important;
        background: #FFFFFF !important;
        box-shadow: 0 1px 2px rgba(10, 22, 40, 0.04) !important;
      }
      article:hover {
        box-shadow: 0 4px 12px rgba(10, 22, 40, 0.06) !important;
      }

      /* Links */
      a {
        color: #4A90B9;
        text-decoration: none;
      }
      a:hover {
        color: #142B52;
        text-decoration: underline;
      }

      /* Time-range pills (24h / 7d / 30d / 1y / all) */
      [class*="duration"],
      [class*="time-range"] {
        color: #5A6B85;
      }
      [class*="duration"][class*="active"],
      [class*="time-range"][class*="active"],
      strong[class*="duration"] {
        color: #142B52 !important;
        font-weight: 600;
      }

      /* Up status indicator */
      [class*="up"]:not([class*="uptime"]):not([class*="upper"]) {
        color: #16A34A;
      }
      /* Down status indicator */
      [class*="down"] {
        color: #DC2626;
      }

      /* Footer */
      footer {
        background-color: #F8FAFC !important;
        border-top: 1px solid #E5EAF1;
        color: #5A6B85;
      }
      footer a {
        color: #4A90B9;
      }

      /* Subtle muted text */
      .secondary,
      [class*="secondary"] {
        color: #5A6B85;
      }
    </style>

assignees:
  - yazan-fin
