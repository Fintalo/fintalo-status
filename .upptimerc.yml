owner: Fintalo
repo: fintalo-status

sites:
  - name: Fintalo Web
    url: https://fintalo.ai
  - name: Supabase REST
    url: https://diuqaipsxeixjegorusd.supabase.co/rest/v1/
    expectedStatusCodes:
      - 200
      - 401
  - name: Supabase Auth
    url: https://diuqaipsxeixjegorusd.supabase.co/auth/v1/health
    expectedStatusCodes:
      - 200
      - 401
  - name: Supabase Storage
    url: https://diuqaipsxeixjegorusd.supabase.co/storage/v1/object/public/
    expectedStatusCodes:
      - 200
      - 400
      - 404
  - name: Dropbox Sign API
    url: https://api.hellosign.com/v3/
    expectedStatusCodes:
      - 200
      - 401
      - 404

status-website:
  cname: status.fintalo.ai
  name: Fintalo Status
  introTitle: "Fintalo Status"
  introMessage: "Real-time status and uptime for Fintalo services."
  navbar:
    - title: Status
      href: /
    - title: Website
      href: https://fintalo.ai
    - title: GitHub
      href: https://github.com/Fintalo/fintalo-status

notifications:
  - type: webhook
    url: $GOOGLE_CHAT_WEBHOOK
    method: POST
    contentType: application/json
    body: '{"text": "*Fintalo Status* — $SITE_NAME is *$SITE_STATUS*\n$SITE_URL"}'

assignees:
  - yazan-fin
